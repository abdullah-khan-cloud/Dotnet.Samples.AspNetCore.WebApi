---
name: Dotnet Application

on: 
   push:

jobs:
    building:
        runs-on: ubuntu-latest
        steps:
          - name: retrieving the code on runner
            uses: actions/checkout@v5
          - name: Initializing the CodeQL
            uses: github/codeql-action/init@v4
            with:
                languages: c#
          - name: resolve and download the dependencies 
            run: dotnet restore -c release
          - name: build the Application
            run: dotnet build - c release --no-restore
          - name: test the Application
            run: dotnet test -c release --no-restore --no-build
          - name: publish the Application
            run: dotnet publish -c release --no-restore --no-build -o ./published/
          - name: zip the Application
            run: tar -cvzf dotnet.app.tar.gz ./published/
          - name: analyze the CodeQL 
            uses: github/codeql-action/analyze@v4
          - name: publish the test results
            if: ${{always()}}
            uses: EnricoMi/publish-unit-test-result-action@v2
            with:
                  files: "**/TestResults/**/*.trx"
                  comment_mode: always